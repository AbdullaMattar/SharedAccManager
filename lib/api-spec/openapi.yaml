openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared Accounts Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: products
    description: Product operations
  - name: accounts
    description: Account operations
  - name: slots
    description: Slot operations
  - name: stats
    description: Statistics and summary operations
  - name: customers
    description: Customer operations
  - name: sales
    description: Sale operations
  - name: subscriptions
    description: Subscription operations
  - name: dashboard
    description: Dashboard and expiry operations
  - name: settings
    description: Admin settings operations
  - name: users
    description: Admin user management
  - name: reports
    description: Revenue reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Public sign-up (creates a staff account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Staff logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Accounts
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts with slot summaries
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountWithSlots"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account (auto-creates slots)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithSlots"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account with slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithSlots"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account (reconciles slots on capacity change)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account with slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithSlots"
        "400":
          description: Validation error (e.g. cannot shrink below occupied slots)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}/reveal-password:
    post:
      operationId: revealAccountPassword
      tags: [accounts]
      summary: Decrypt and reveal account password (writes audit log)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decrypted password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealPasswordResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Slots
  /accounts/{id}/slots:
    get:
      operationId: listAccountSlots
      tags: [slots]
      summary: List slots for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"

  # Stats / Summary endpoints
  /stats/inventory:
    get:
      operationId: getInventoryStats
      tags: [stats]
      summary: Inventory overview — product counts, slot usage, account statuses
      responses:
        "200":
          description: Inventory statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStats"

  /stats/audit-log:
    get:
      operationId: listAuditLog
      tags: [stats]
      summary: Recent audit log entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  # Customers
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List or search customers by partial name or phone
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Phone already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer detail, subscriptions, and total spent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Phone already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer without subscriptions
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Customer deleted
        "409":
          description: Customer has subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Sales
  /sales/availability:
    get:
      operationId: getSaleAvailability
      tags: [sales]
      summary: List products with free slots and manually selectable free slots
      responses:
        "200":
          description: Sale availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleAvailability"

  /sales:
    post:
      operationId: createSale
      tags: [sales]
      summary: Atomically sell an auto-assigned or selected free slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResult"
        "409":
          description: Slot is unavailable or already sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Subscriptions
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions with optional status or customer filter
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionSummary"

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get subscription detail, payments, and same-slot history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscription detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/{id}/notes:
    patch:
      operationId: updateSubscriptionNotes
      tags: [subscriptions]
      summary: Update subscription notes
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionNotesInput"
      responses:
        "200":
          description: Notes updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Atomically cancel an active subscription and free its slot
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionInput"
      responses:
        "200":
          description: Subscription cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "409":
          description: Subscription is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/{id}/refund:
    post:
      operationId: refundSubscription
      tags: [subscriptions]
      summary: Record a full refund for a cancelled subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Refund recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: Subscription is not cancelled or has already been fully refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/{id}/renew:
    post:
      operationId: renewSubscription
      tags: [subscriptions]
      summary: Atomically renew into a new subscription with full payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewalInput"
      responses:
        "201":
          description: Renewal completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenewalResult"
        "409":
          description: Subscription cannot be renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get expiry, inventory, and monthly revenue dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /expiring:
    get:
      operationId: listExpiringSubscriptions
      tags: [dashboard]
      summary: List active subscriptions expiring within the live reminder window
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 365
      responses:
        "200":
          description: Expiring subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get live settings (admin only)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update live settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit or disable user (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports/revenue:
    get:
      operationId: getRevenueReport
      tags: [reports]
      summary: Get current-month revenue and product breakdown
      responses:
        "200":
          description: Revenue report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueReport"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        disabled:
          type: boolean

    Product:
      type: object
      required:
        [
          id,
          name,
          service,
          defaultCapacity,
          defaultDurationDays,
          defaultPrice,
          createdAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        service:
          type: string
        defaultCapacity:
          type: integer
        defaultDurationDays:
          type: integer
        defaultPrice:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        [name, service, defaultCapacity, defaultDurationDays, defaultPrice]
      properties:
        name:
          type: string
          minLength: 1
        service:
          type: string
          minLength: 1
        defaultCapacity:
          type: integer
          minimum: 1
        defaultDurationDays:
          type: integer
          minimum: 1
        defaultPrice:
          type: number
          minimum: 0
        notes:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        service:
          type: string
          minLength: 1
        defaultCapacity:
          type: integer
          minimum: 1
        defaultDurationDays:
          type: integer
          minimum: 1
        defaultPrice:
          type: number
          minimum: 0
        notes:
          type: ["string", "null"]

    Account:
      type: object
      required: [id, productId, label, email, capacity, status, startDate, expiryDate, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        label:
          type: string
        email:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum: [active, disabled, needs_attention]
        startDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AccountWithSlots:
      type: object
      required:
        [
          id,
          productId,
          productName,
          label,
          email,
          capacity,
          status,
          startDate,
          expiryDate,
          createdAt,
          slots,
          freeSlots,
          occupiedSlots,
        ]
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        label:
          type: string
        email:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum: [active, disabled, needs_attention]
        startDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        freeSlots:
          type: integer
        occupiedSlots:
          type: integer

    AccountInput:
      type: object
      required: [productId, label, email, password, capacity, status, startDate, expiryDate]
      properties:
        productId:
          type: integer
        label:
          type: string
          minLength: 1
        email:
          type: string
        password:
          type: string
          minLength: 1
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, disabled, needs_attention]
        startDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        notes:
          type: string

